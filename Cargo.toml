[workspace]
members = [
    "vest-core",
    "vest-cli",
    "vest-config",
    "vest-providers",
    "vest-agent",
    "vest-scanner",
    "vest-storage",
    "vest-report",
    "vest-tools",
    "vest-payloads",
    "vest-test-utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Zelmari/vest"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ureq = { version = "3", features = ["json"] }
chromiumoxide = "0.6"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
thiserror = "2"
async-trait = "0.1"
url = "2"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
goblin = "0.9"
capstone = "0.12"
iced-x86 = "1"
backon = "1"
futures = "0.3"

# Internal crate dependencies
vest-core = { path = "vest-core" }
vest-config = { path = "vest-config" }
vest-providers = { path = "vest-providers" }
vest-agent = { path = "vest-agent" }
vest-scanner = { path = "vest-scanner" }
vest-storage = { path = "vest-storage" }
vest-report = { path = "vest-report" }
vest-tools = { path = "vest-tools" }
vest-payloads = { path = "vest-payloads" }
vest-test-utils = { path = "vest-test-utils" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
