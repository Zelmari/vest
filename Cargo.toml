[workspace]
members = [
    "vest-core",
    "vest-cli",
    "vest-config",
    "vest-providers",
    "vest-agent",
    "vest-scanner",
    "vest-storage",
    "vest-report",
    "vest-tools",
    "vest-payloads",
    "vest-test-utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vest/vest"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
url = "2"
derive_builder = "0.20"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
once_cell = "1"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
dashmap = "6"
pcap = "2"
goblin = "0.9"
capstone = "0.12"
iced-x86 = "1"
rig-core = "0.12"
genai = "0.3"
async-openai = "0.27"
backon = "1"
qdrant-client = "1"
read-process-memory = "0.1"

# Internal crate dependencies
vest-core = { path = "vest-core" }
vest-config = { path = "vest-config" }
vest-providers = { path = "vest-providers" }
vest-agent = { path = "vest-agent" }
vest-scanner = { path = "vest-scanner" }
vest-storage = { path = "vest-storage" }
vest-report = { path = "vest-report" }
vest-tools = { path = "vest-tools" }
vest-payloads = { path = "vest-payloads" }
vest-test-utils = { path = "vest-test-utils" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
