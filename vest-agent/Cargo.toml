[package]
name = "vest-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Exposes permissive/unrestricted auth helpers for tests (POL-2).
test-utils = []

[dependencies]
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
url.workspace = true
sha2 = { workspace = true }
thiserror = { workspace = true }

vest-core = { workspace = true }
vest-config = { workspace = true }
vest-providers = { workspace = true }
vest-scanner = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rand = "0.8"
uuid = { workspace = true }
rusqlite = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
vest-core = { workspace = true }
vest-storage = { workspace = true }
vest-report = { workspace = true }
# Integration tests link the library without cfg(test); enable POL-2 helpers.
vest-agent = { path = ".", features = ["test-utils"] }
